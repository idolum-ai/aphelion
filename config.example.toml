[identity]
user_agent = ""

[telegram]
bot_token = "telegram-bot-token"
poll_timeout = 30

[principals.telegram]
admin_user_ids = [123456789]
approved_user_ids = []

[providers]
default = "anthropic"

[providers.anthropic]
api_key = "anthropic-api-key"
model = "claude-sonnet-4-6"
max_tokens = 4096

[sessions]
db_path = "~/.config/aphelion/sessions.db"
idle_expiry = "24h"

[agent]
workspace = "/absolute/path/to/workspace"
max_iterations = 50
tool_timeout = 300
bootstrap_files = [
  "SOUL.md",
  "IDENTITY.md",
  "USER.md",
  "AGENTS.md",
  "TOOLS.md",
  "BOOTSTRAP.md",
]
dynamic_files = ["MEMORY.md", "HEARTBEAT.md"]
bootstrap_max_chars = 20000
bootstrap_total_max_chars = 150000
daily_notes = true
daily_notes_dir = "memory"
