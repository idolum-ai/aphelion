[identity]
user_agent = ""

[telegram]
bot_token = "telegram-bot-token"
poll_timeout = 30

[principals.telegram]
admin_user_ids = [123456789]
approved_user_ids = []

[governor]
backend = "auto"
native_provider = "anthropic"

[governor.codex]
auth_source = "auto"
codex_home = ""
base_url = "https://chatgpt.com/backend-api/codex"

[providers]
default = "anthropic"

[providers.anthropic]
api_key = "anthropic-api-key"
model = "claude-sonnet-4-6"
max_tokens = 4096

[sessions]
db_path = "~/.config/aphelion/sessions.db"
idle_expiry = "24h"

[agent]
workspace = "/absolute/path/to/workspace"
max_iterations = 50
tool_timeout = 300
bootstrap_files = [
  "SOUL.md",
  "IDENTITY.md",
  "USER.md",
  "AGENTS.md",
  "TOOLS.md",
  "BOOTSTRAP.md",
]
dynamic_files = ["MEMORY.md", "HEARTBEAT.md"]
bootstrap_max_chars = 20000
bootstrap_total_max_chars = 150000
daily_notes = true
daily_notes_dir = "memory"

[face]
backend = "provider"

[heartbeat]
enabled = false
every = "30m"
target = "last"

[heartbeat.active_hours]
start = ""
end = ""
timezone = ""

[cron]
enabled = false

[[cron.jobs]]
id = "sample"
every = "2h"
prompt = "Summarize anything worth surfacing to the admin."
delivery = "none"
enabled = false

[voice]
mode = "off"
openai_api_key = ""
openai_base_url = ""
openai_model = "whisper-1"
elevenlabs_api_key = ""
elevenlabs_base_url = ""
elevenlabs_voice_id = ""
elevenlabs_model_id = "eleven_multilingual_v2"
