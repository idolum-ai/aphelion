[identity]
user_agent = ""

[telegram]
bot_token = "telegram-bot-token"
poll_timeout = 30
stream_edit_interval = "300ms"
stream_cursor = " ▉"
tool_progress = "all"
tool_progress_cleanup = false

[principals.telegram]
admin_user_ids = [123456789]
approved_user_ids = []

[governor]
backend = "auto"
native_provider = "anthropic"

[governor.codex]
auth_source = "auto"
codex_home = ""
base_url = "https://chatgpt.com/backend-api/codex"
context_window = 200000

[providers]
default = "anthropic"
fallback_chain = []

[providers.anthropic]
api_key = "anthropic-api-key"
model = "claude-sonnet-4-6"
max_tokens = 4096
context_window = 200000

[providers.openrouter]
api_key = ""
base_url = "https://openrouter.ai/api/v1"
model = "anthropic/claude-sonnet-4-6"
max_tokens = 4096
context_window = 200000

[sessions]
db_path = "~/.aphelion/state/sessions.db"
idle_expiry = "24h"
max_context_ratio = 0.75
compaction_ratio = 0.55
compaction_strategy = "summarize"

[agent]
prompt_root = "~/.aphelion/agent"
exec_root = "/absolute/path/to/workspace"
shared_memory_root = "~/.aphelion/agent"
user_workspace_root = "~/.aphelion/state/isolated/workspaces"
user_memory_root = "~/.aphelion/state/isolated/memory"
# Deprecated legacy alias. If present without the split roots above, it is used
# as prompt_root + exec_root + shared_memory_root.
# workspace = "/absolute/path/to/workspace"
max_iterations = 50
tool_timeout = 300
bootstrap_files = [
  "SOUL.md",
  "IDENTITY.md",
  "USER.md",
  "AGENTS.md",
  "TOOLS.md",
  "BOOTSTRAP.md",
]
dynamic_files = ["MEMORY.md", "HEARTBEAT.md"]
bootstrap_max_chars = 20000
bootstrap_total_max_chars = 150000
daily_notes = true
daily_notes_dir = "memory/daily"

[thinking]
effort = "medium"
summary = "auto"

[thinking.defaults]
default = "medium"
heartbeat = "low"
cron = "low"
recovery = "medium"

[face]
backend = "provider"

[heartbeat]
enabled = false
every = "30m"
target = "last"

[heartbeat.active_hours]
start = ""
end = ""
timezone = ""

[cron]
enabled = false

[[cron.jobs]]
id = "sample"
every = "2h"
prompt = "Summarize anything worth surfacing to the admin."
delivery = "none"
enabled = false

[voice]
mode = "off"
openai_api_key = ""
openai_base_url = ""
openai_model = "whisper-1"
elevenlabs_api_key = ""
elevenlabs_base_url = ""
elevenlabs_voice_id = ""
elevenlabs_model_id = "eleven_multilingual_v2"
