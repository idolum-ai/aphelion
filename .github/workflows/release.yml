name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -o dist/aphelion .

      - name: Package tarball
        run: |
          tar -czf "aphelion-linux-${{ matrix.arch }}.tar.gz" -C dist aphelion

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aphelion-linux-${{ matrix.arch }}
          path: aphelion-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find dist -name '*.tar.gz' -exec cp {} release/ \;

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tar.gz
